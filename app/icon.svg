<path d="M102 164 168 202 168 309 102 345Z" fill="url(#silver2)" stroke="#E8F3FF" stroke-width="3" stroke-linejoin="round"/>
<path d="M410 164 344 202 344 309 410 345Z" fill="url(#silver2)" stroke="#6DDCFF" stroke-width="3" stroke-linejoin="round"/>
<path d="M102 345 168 309 256 361 256 437Z" fill="url(#silver2)" stroke="#D9E5F3" stroke-width="3" stroke-linejoin="round"/>
<path d="M410 345 344 309 256 361 256 437Z" fill="url(#silver)" stroke="#B5EFFF" stroke-width="3" stroke-linejoin="round"/>
<!-- Blue illuminated understructure -->
<path d="M168 202 256 151 344 202 344 309 256 361 168 309Z" fill="#031733" stroke="#087EFF" stroke-width="7" stroke-linejoin="round" filter="url(#glow)"/>
<path d="M256 151 344 202 256 252 168 202Z" fill="url(#blue)" stroke="#6DF9FF" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M168 202 256 252 256 361 168 309Z" fill="url(#blue)" stroke="#14C8FF" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M344 202 256 252 256 361 344 309Z" fill="#052E83" stroke="#078AFF" stroke-width="2.5" stroke-linejoin="round"/>
<!-- Recessed electric-blue hex core -->
<path d="M256 200 309 231 309 293 256 324 203 293 203 231Z" fill="url(#core)" stroke="#27D9FF" stroke-width="4" stroke-linejoin="round" filter="url(#glow)"/>
<path d="M256 211 300 237 300 287 256 313 212 287 212 237Z" fill="none" stroke="#80F7FF" stroke-opacity=".7" stroke-width="2"/>
<circle cx="256" cy="260" r="7" fill="#54EDFF" filter="url(#glow)"/>
</svg>