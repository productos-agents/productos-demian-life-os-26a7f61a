<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09182D"/><stop offset=".48" stop-color="#05080E"/><stop offset="1" stop-color="#020306"/></linearGradient>
  <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset=".22" stop-color="#ADB9C9"/><stop offset=".45" stop-color="#34465D"/><stop offset=".72" stop-color="#DAE5F4"/><stop offset="1" stop-color="#506179"/></linearGradient>
  <linearGradient id="silver2" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#F5F8FF"/><stop offset=".4" stop-color="#8094AE"/><stop offset="1" stop-color="#202E43"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#62F7FF"/><stop offset=".26" stop-color="#119DFF"/><stop offset=".65" stop-color="#075EFF"/><stop offset="1" stop-color="#00246F"/></linearGradient>
  <radialGradient id="core" cx=".5" cy=".32" r=".8"><stop stop-color="#0B5BE7"/><stop offset=".48" stop-color="#052D81"/><stop offset="1" stop-color="#020816"/></radialGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect width="512" height="512" rx="98" fill="url(#bg)"/>
<rect x="1.5" y="1.5" width="509" height="509" rx="96" fill="none" stroke="#0C3F86" stroke-opacity=".45" stroke-width="3"/>
<ellipse cx="255" cy="260" rx="168" ry="164" fill="#0078FF" opacity=".16" filter="url(#soft)"/>
